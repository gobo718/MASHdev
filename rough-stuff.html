<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition The Rough Stuff</title>
<link rel="stylesheet" href="rough-stuff.css?v=293">
<link rel="stylesheet" href="game-bar.css?v=226">
</head>
<body>
<main class="rough">
  <header>
    <strong>THE ROUGH STUFF</strong>
    <div>
      <button type="button" class="active" data-view="thumbs" aria-pressed="true">THUMBNAILS</button>
      <button type="button" data-view="parade" aria-pressed="false">PARADE MODE</button>
    </div>
  </header>
  <section class="filters" aria-label="Sort and Trash">
    <button type="button" data-sort="start_date" aria-pressed="false">START DATE</button>
    <button type="button" data-sort="last_worked" aria-pressed="false">LAST WORKED</button>
    <button type="button" data-sort="letter_count" aria-pressed="false">LETTER COUNT</button>
    <button type="button" data-sort="total_time" aria-pressed="false">TOTAL TIME</button>
    <button type="button" disabled title="Global Tags come later">TAGS — LATER</button>
    <span></span>
    <button type="button" data-trash aria-pressed="false">🗑 TRASH · 1 DAY</button>
  </section>
  <p id="drafts-status" class="drafts-status" role="status" aria-live="polite">Saved drafts are not connected to an account in this build.</p>
  <nav id="parade-navigation" class="parade-navigation" aria-label="Rough Stuff PARADE controls" hidden>
    <button type="button" id="parade-prev" aria-label="Previous creation">PREV</button>
    <span id="parade-position" role="status" aria-live="polite"></span>
    <button type="button" id="parade-next" aria-label="Next creation">NEXT</button>
  </nav>
  <section id="drafts" class="drafts" aria-label="Saved Creations"></section>
  <button type="button" class="pc">💻 BLURBLOOPS PC</button>
</main>
<nav class="game-menu-bar"><a href="studio.html">STUDIO</a><a href="index.html">MUSEUM</a><button type="button" data-display-mode>FULL</button></nav>
<script src="game-bar.js?v=226"></script>
<script src="studio-draft-library.js?v=284"></script>
<script src="studio-draft-navigation.js?v=283"></script>
<script src="rough-stuff.js?v=300"></script>
</body>
</html>
