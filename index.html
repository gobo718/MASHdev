<script>
/* v266 — Museum Map label optical centering. Move only the visible text, never the plates. */
(function(){
  const labels = document.querySelectorAll('.museum-hub .hub-link, .museum-hub button');

  function ensureTextWrapper(label){
    let wrapper = label.querySelector(':scope > .museum-map-label-text');
    if(wrapper) return wrapper;
    wrapper = document.createElement('span');
    wrapper.className = 'museum-map-label-text';
    // Keep nested authored lettering (including the separately sized K)
    // together as ONE phrase when the entire plaque counterrotates.
    const copy = document.createElement('span');
    copy.className = 'museum-map-label-copy';
    while(label.firstChild) copy.appendChild(label.firstChild);
    wrapper.appendChild(copy);
    label.appendChild(wrapper);
    return wrapper;
  }

  function sizeMuseumMap(){
    const root = document.documentElement;
    const bar = document.querySelector('.game-menu-bar');
    const width = root.clientWidth;
    const height = Math.max(0, root.clientHeight - (bar?.getBoundingClientRect().height || 0));
    root.style.setProperty('--museum-game-w', `${width}px`);
    root.style.setProperty('--museum-game-h', `${height}px`);
  }

  function centerMuseumMapLabels(){
    const portrait = matchMedia('(orientation: portrait)').matches;
    labels.forEach(label => {
      const text = ensureTextWrapper(label);
      const fontSize = parseFloat(getComputedStyle(label).fontSize) || 16;
      const opticalShift =
        1.15
        + 6.285 * Math.exp(-0.35 * (fontSize - 8))
        - 3.485 * Math.exp(-0.60 * (fontSize - 11));
      // The wrapper is sized to the TRANSPOSED plate interior. After the
      // quarter-turn it fits the original plate without squeezing the map.
      // Its child keeps INFORMATION DESK and the optical K together.
      text.style.display = portrait ? 'flex' : 'inline-block';
      text.style.alignItems = portrait ? 'center' : '';
      text.style.justifyContent = portrait ? 'center' : '';
      text.style.width = portrait ? Math.max(4,label.clientHeight-12)+'px' : '';
      text.style.height = portrait ? Math.max(4,label.clientWidth-12)+'px' : '';
      text.style.setProperty('--museum-optical-shift',opticalShift+'px');
      text.style.setProperty('--museum-label-angle',portrait?'-90deg':'0deg');
      text.style.transform = portrait
        ? `rotate(-90deg) translateY(${opticalShift}px)`
        : `translateY(${opticalShift}px)`;
    });
  }

  let previousMuseumPortrait = matchMedia('(orientation: portrait)').matches;
  function layoutMuseumMap(){
    sizeMuseumMap();
    centerMuseumMapLabels();
    const portrait = matchMedia('(orientation: portrait)').matches;
    if(portrait !== previousMuseumPortrait){
      previousMuseumPortrait = portrait;
      const map = document.querySelector('.museum-hub');
      if(map){
        map.classList.remove('museum-signage-settling');
        void map.offsetWidth;
        map.classList.add('museum-signage-settling');
      }
    }
  }

  layoutMuseumMap();
  addEventListener('resize', layoutMuseumMap, {passive:true});
  addEventListener('mashpeditionviewportchange', layoutMuseumMap);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMuseumMap);
})();
</script>
